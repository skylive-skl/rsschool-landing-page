<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <header class="header" id="header">
      <div class="header__container container">
        <a href="./index.html" class="header__logo logo" aria-label="Coffee House home page">
          <img src="./src/assets/icons/logo.svg" alt="Coffee House logo" width="100" height="60" class="logo__img" />
        </a>
        <nav class="header__nav nav" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#favorite" class="nav__link">Favorite coffee</a>
            </li>
            <li class="nav__item">
              <a href="#about" class="nav__link">About</a>
            </li>
            <li class="nav__item">
              <a href="#app" class="nav__link">Mobile app</a>
            </li>
            <li class="nav__item">
              <a href="#contact" class="nav__link">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <button type="button" class="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
            <span class="theme-toggle__thumb" aria-hidden="true"></span>
            <span class="theme-toggle__icon theme-toggle__icon--light" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.5"/>
                <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/>
              </svg>
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--dark" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
              </svg>
            </span>
          </button>
          <a href="./menu.html" class="header__menu-link menu-link">
            <span class="menu-link__text">Menu</span>
            <img src="./src/assets/icons/cup.svg" alt="" width="20" height="20" aria-hidden="true" class="menu-link__icon" />
          </a>
          <button class="burger header__burger" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-menu">
            <span class="burger__line" aria-hidden="true"></span>
            <span class="burger__line" aria-hidden="true"></span>
            <span class="burger__line" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <footer class="footer" id="contact">
      <div class="footer__container container">
        <div class="footer__wrapper">
          <div class="footer__content">
            <h2 class="footer__title">
              Sip, Savor, Smile. <br />
              <span class="footer__title--accent">It’s coffee time!</span>
            </h2>
            <ul class="footer__socials">
              <li class="footer__social-item">
                <a
                  href="https://twitter.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="footer__social-link"
                  aria-label="Visit our Twitter"
                >
                  <img src="./src/assets/icons/twitter.svg" alt="" width="24" height="24" aria-hidden="true" />
                </a>
              </li>
              <li class="footer__social-item">
                <a
                  href="https://instagram.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="footer__social-link"
                  aria-label="Visit our Instagram"
                >
                  <img src="./src/assets/icons/instagram.svg" alt="" width="24" height="24" aria-hidden="true" />
                </a>
              </li>
              <li class="footer__social-item">
                <a
                  href="https://facebook.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="footer__social-link"
                  aria-label="Visit our Facebook"
                >
                  <img src="./src/assets/icons/facebook.svg" alt="" width="24" height="24" aria-hidden="true" />
                </a>
              </li>
            </ul>
          </div>
          <div class="footer__contacts">
            <h3 class="footer__contacts-title">Contact Us</h3>
            <ul class="footer__contacts-list">
              <li class="footer__contact-item">
                <a
                  href="https://maps.google.com/?q=8558+Green+Rd.,+LA"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="footer__contact-link"
                >
                  <img
                    src="./src/assets/icons/pin.svg"
                    alt=""
                    width="20"
                    height="20"
                    aria-hidden="true"
                    class="footer__contact-icon"
                  />
                  <span>8558 Green Rd., LA</span>
                </a>
              </li>
              <li class="footer__contact-item">
                <a href="tel:+16035550123" class="footer__contact-link">
                  <img
                    src="./src/assets/icons/phone.svg"
                    alt=""
                    width="20"
                    height="20"
                    aria-hidden="true"
                    class="footer__contact-icon"
                  />
                  <span>+1 (603) 555-0123</span>
                </a>
              </li>
              <li class="footer__contact-item footer__contact-item--static">
                <img
                  src="./src/assets/icons/clock.svg"
                  alt=""
                  width="20"
                  height="20"
                  aria-hidden="true"
                  class="footer__contact-icon"
                />
                <span>Mon-Sat: 9:00 AM – 23:00 PM</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>

    <script type="module" src="./src/js/home.js"></script>
  </body>
</html>
